<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 背景圆角方形 -->
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="url(#bg)" />
  <!-- 字母 L -->
  <text x="32" y="46" font-family="'Inter','Segoe UI',sans-serif" font-size="38" font-weight="700" fill="url(#fg)" text-anchor="middle" dominant-baseline="central">L</text>
</svg>